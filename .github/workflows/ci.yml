name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Django configuration
        run: |
          python backend/manage.py check

      - name: Run backend static checks
        run: |
          python -m compileall backend

      - name: Run backend tests if available
        run: |
          if [ -d backend/tests ] || [ -d backend/preview/tests ]; then
            python -m pip install pytest
            python -m pytest -q
          else
            echo "No backend test suite found; skipping."
          fi

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run frontend lint
        run: pnpm lint
        working-directory: frontend

      - name: Run frontend tests if available
        run: |
          if [ -f frontend/package.json ]; then
            pnpm test --if-present
          else
            echo "No frontend package.json found; skipping tests."
          fi
        working-directory: frontend

      - name: Build frontend
        run: pnpm build
        working-directory: frontend

  ai-ready-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify baseline repository files
        run: |
          test -f AGENTS.md
          test -f .github/copilot-instructions.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
